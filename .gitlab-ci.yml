# Orion Full-Stack — CI/CD pipeline (GitOps)
#
# Branch model (sandbox environments, promoted left to right):
#   solution --> dev --> test --> prod
#   - solution : graded source of truth (runs CI, does NOT deploy)
#   - dev/test/prod : environment branches. A push here runs the full pipeline
#     and, on success, pins the freshly built image into the matching Helm
#     values file (values-<env>.yaml) and pushes it back [skip ci]. Argo CD
#     (running locally) detects the commit and deploys to namespace <env>.
#     => No inbound access to the cluster is ever required.
#
# Stages:
#   .pre     : promotion-guard  (enforce dev->test->prod on merge requests)
#   test     : unit tests + coverage + dependency report (front & back)
#   quality  : SonarQube static analysis with blocking quality gate
#   package  : classic builds (artifacts) + Docker images pushed to the
#              GitLab Container Registry, tagged <ref>-<short SHA>
#   security : Trivy vulnerability scan of both images (blocking HIGH/CRITICAL)
#              + gitleaks secrets scan of the git history (blocking, allowlisted)
#   backup   : timestamped archive of the deployable artifacts (rollback support)
#   verify   : in-CI smoke deployment of the images + HTTP checks
#   release  : GitOps — pin the image tag into values-<env>.yaml (dev/test/prod)
#   notify   : Discord notification, routed to the environment's channel
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   SONAR_HOST_URL, SONAR_TOKEN         -> enable the quality stage
#   GITOPS_PUSH_TOKEN (write_repository)-> enable the release stage
#   DISCORD_WEBHOOK_URL_DEV/_TEST/_PROD -> per-environment notifications
#   (DISCORD_WEBHOOK_URL is used as a fallback for any other branch)
# $CI_REGISTRY_* variables are provided automatically by GitLab.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "solution"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_BRANCH == "prod"'

stages:
  - .pre
  - test
  - quality
  - package
  - security
  - backup
  - verify
  - release
  - notify

variables:
  DOCKER_TLS_CERTDIR: ""
  BACK_IMAGE: $CI_REGISTRY_IMAGE/back:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  FRONT_IMAGE: $CI_REGISTRY_IMAGE/front:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ----------------------------------------------------------- promotion

# Enforce the promotion path on merge requests: prod accepts merges from
# "test" only, test accepts merges from "dev" only. Branch protection alone
# cannot express this, so a CI gate makes the rule explicit and demonstrable.
promotion-guard:
  image: alpine:3.20
  stage: .pre
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "prod" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "test")'
  script:
    - |
      T="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"; S="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      if [ "$T" = "prod" ] && [ "$S" != "test" ]; then echo "REJECTED: prod accepts merges from 'test' only (source was '$S')."; exit 1; fi
      if [ "$T" = "test" ] && [ "$S" != "dev"  ]; then echo "REJECTED: test accepts merges from 'dev' only (source was '$S')."; exit 1; fi
      echo "Promotion '$S' -> '$T' allowed."

# ---------------------------------------------------------------- test

test-back:
  image: gradle:8.7-jdk17
  stage: test
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [back/.gradle]
  script:
    - bash scripts/check_deps.sh back
    - cd back
    - ./gradlew --no-daemon test jacocoTestReport
  artifacts:
    when: always
    reports:
      junit: back/build/test-results/test/*.xml
    paths:
      - back/build/classes/            # sonar.java.binaries — needed by the sonarqube job
      - back/build/reports/jacoco/test/jacocoTestReport.xml
      - reports/

test-front:
  image: cypress/browsers:latest
  stage: test
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.npm]
  script:
    - cd front && npm ci && cd ..
    - bash scripts/check_deps.sh front
    - cd front
    - CHROME_BIN=/opt/google/chrome/chrome npx @angular/cli test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox --code-coverage
  artifacts:
    when: always
    paths:
      - front/coverage/
      - reports/

# ------------------------------------------------------------- quality

sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  stage: quality
  needs: [test-back, test-front]
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
  variables:
    SONAR_USER_HOME: $CI_PROJECT_DIR/.sonar
    GIT_DEPTH: "0"
  cache:
    key: sonar-$CI_COMMIT_REF_SLUG
    paths: [.sonar/cache]
  script:
    # sonar.qualitygate.wait blocks the pipeline until SonarQube returns the gate
    # verdict: a failing gate fails this job and stops the release. Toggle via the
    # CI/CD variable SONAR_QUALITYGATE_WAIT (default "true"); set it to "false" to
    # make the gate observational (non-blocking) without touching the pipeline.
    - sonar-scanner -Dsonar.qualitygate.wait="${SONAR_QUALITYGATE_WAIT:-true}"

# ------------------------------------------------------------- package

build-back:
  image: gradle:8.7-jdk17
  stage: package
  needs: [test-back]
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [back/.gradle]
  script:
    - cd back
    - ./gradlew --no-daemon build -x test
  artifacts:
    paths: [back/build/libs/*.jar]

build-front:
  image: node:20-alpine
  stage: package
  needs: [test-front]
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.npm]
  script:
    - cd front
    - npm ci
    - npx @angular/cli build --optimization
  artifacts:
    paths: [front/dist/]

docker-back:
  image: docker:27
  stage: package
  needs: [test-back]
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --target back -t "$BACK_IMAGE" .
    - docker push "$BACK_IMAGE"

docker-front:
  image: docker:27
  stage: package
  needs: [test-front]
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --target front -t "$FRONT_IMAGE" .
    - docker push "$FRONT_IMAGE"

# ------------------------------------------------------------ security

trivy-back:
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  stage: security
  needs: [docker-back]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  cache:
    key: trivy-db
    paths: [.trivycache]
  script:
    - mkdir -p reports
    - trivy image --cache-dir .trivycache --ignorefile .trivyignore
      --format table --output reports/trivy-back.txt
      --exit-code 1 --severity HIGH,CRITICAL "$BACK_IMAGE"
  artifacts:
    when: always
    paths: [reports/trivy-back.txt]

trivy-front:
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  stage: security
  needs: [docker-front]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  cache:
    key: trivy-db
    paths: [.trivycache]
  script:
    - mkdir -p reports
    - trivy image --cache-dir .trivycache --ignorefile .trivyignore
      --format table --output reports/trivy-front.txt
      --exit-code 1 --severity HIGH,CRITICAL "$FRONT_IMAGE"
  artifacts:
    when: always
    paths: [reports/trivy-front.txt]

# Secrets scan: audits the whole git history for leaked credentials. Legitimate
# paths (example templates, gitignored local secrets) are allowlisted in
# .gitleaks.toml. Any real secret NOT excluded fails the job; the report is
# always kept as an artifact (showable to the evaluator). needs: [] -> runs
# immediately (fail-fast), it only needs the source.
gitleaks:
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  stage: security
  needs: []
  variables:
    GIT_DEPTH: "0"   # full history scan
  script:
    - mkdir -p reports
    - gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
      --report-format json --report-path reports/gitleaks.json --exit-code 1
  artifacts:
    when: always
    paths: [reports/gitleaks.json]

# -------------------------------------------------------------- backup

backup-artifacts:
  image: alpine:3.20
  stage: backup
  needs: [build-back, build-front]
  before_script:
    - apk add --no-cache bash git tar
  script:
    - bash scripts/backup.sh backups
  artifacts:
    paths: [backups/]
    expire_in: 1 week

# -------------------------------------------------------------- verify

# In-CI smoke: boots both images and curls them. Independent of the cluster;
# gates the GitOps release below.
deploy-smoke:
  image: docker:27
  stage: verify
  needs: [trivy-back, trivy-front]
  services:
    - docker:27-dind
  variables:
    DEPLOY_HOST: docker
  before_script:
    - apk add --no-cache bash curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - bash scripts/deploy_demo.sh "$BACK_IMAGE" "$FRONT_IMAGE"

# ------------------------------------------------------------- release

# GitOps release: pin the just-built image into values-<env>.yaml and push it
# back with [skip ci]. Argo CD (running on the local Docker Desktop cluster)
# polls the branch and syncs the change into namespace <env>.
gitops-release:
  image: alpine:3.20
  stage: release
  # deploy-smoke gates deployability; sonarqube (optional so the pipeline still
  # works when Sonar is not configured) gates on the quality gate: a red gate
  # fails/omits sonarqube -> this job is skipped -> no release. The gate truly
  # blocks the deployment, not just the pipeline status.
  needs:
    - deploy-smoke
    - job: sonarqube
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"'
  before_script:
    - apk add --no-cache bash git yq
  script:
    - bash scripts/gitops_release.sh "$CI_COMMIT_BRANCH" "$CI_REGISTRY_IMAGE" "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

# -------------------------------------------------------------- notify

# The notify script routes to DISCORD_WEBHOOK_URL_<BRANCH> (DEV/TEST/PROD),
# falling back to DISCORD_WEBHOOK_URL for any other branch.
notify-success:
  image: python:3.12-alpine
  stage: notify
  when: on_success
  script:
    - python3 scripts/notify_discord.py success

notify-failure:
  image: python:3.12-alpine
  stage: notify
  when: on_failure
  script:
    - python3 scripts/notify_discord.py failed
