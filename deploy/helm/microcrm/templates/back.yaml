apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-back
  labels: {app: {{ .Release.Name }}-back}
spec:
  replicas: {{ .Values.back.replicaCount }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-back}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-back}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: back
          image: "{{ .Values.image.registry }}/back:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.back.port }}
          readinessProbe:
            httpGet: {path: /, port: {{ .Values.back.port }}}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: {{ .Values.back.port }}}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.back.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-back
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-back}
  ports:
    - port: {{ .Values.back.port }}
      targetPort: {{ .Values.back.port }}
