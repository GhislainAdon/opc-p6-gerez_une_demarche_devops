# Logstash pipeline — receives container logs (GELF) and CI/deployment events,
# indexes them into Elasticsearch for Kibana dashboards (performance + DORA).
input {
  gelf {
    port => 12201
  }
  beats {
    port => 5044
  }
}

filter {
  # Tag the source component from the container name (orion-back / orion-front)
  if [container_name] {
    grok {
      match => { "container_name" => "orion-%{WORD:component}" }
      tag_on_failure => []
    }
  }
  # Extract HTTP status codes from access-style log lines when present
  grok {
    match => { "message" => "%{IP:client_ip}.*\"%{WORD:http_verb} %{URIPATHPARAM:http_path}[^\"]*\" %{NUMBER:http_status:int} %{NUMBER:bytes:int}" }
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-logs-%{+YYYY.MM.dd}"
  }
}
