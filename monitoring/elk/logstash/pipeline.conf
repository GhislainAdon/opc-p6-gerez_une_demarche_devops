# Logstash pipeline — receives container logs (GELF) and CI/deployment events,
# indexes them into Elasticsearch for Kibana dashboards (performance + DORA).
input {
  gelf {
    port => 12201
  }
  beats {
    port => 5044
  }
}

filter {
  # Tag the source component from the container name (orion-back / orion-front)
  if [container_name] {
    grok {
      match => { "container_name" => "orion-%{WORD:component}" }
      tag_on_failure => []
    }
  }

  # Front (Caddy) logs are JSON access logs: extract verb, path and status
  if [message] =~ "^\{" {
    json {
      source => "message"
      target => "access"
      skip_on_invalid_json => true
    }
    if [access][status] {
      mutate { add_field => { "http_status" => "%{[access][status]}" } }
      mutate { convert => { "http_status" => "integer" } }
    }
    if [access][request][method] {
      mutate {
        add_field => {
          "http_verb" => "%{[access][request][method]}"
          "http_path" => "%{[access][request][uri]}"
        }
      }
    }
    mutate { remove_field => ["access"] }
  } else {
    # Back (Spring Boot) logs: extract the log level
    grok {
      match => { "message" => "\s(?<log_level>INFO|WARN|ERROR|DEBUG)\s" }
      tag_on_failure => []
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-logs-%{+YYYY.MM.dd}"
  }
}
