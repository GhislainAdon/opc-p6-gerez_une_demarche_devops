# SonarQube configuration — monorepo analysis (backend Java + frontend TypeScript)
# SONAR_HOST_URL and SONAR_TOKEN are provided via CI/CD variables or local env.
sonar.projectKey=orion-fullstack
sonar.projectName=Orion Full-Stack (MicroCRM)

sonar.sources=back/src/main,front/src
sonar.tests=back/src/test
sonar.test.inclusions=front/src/**/*.spec.ts
sonar.exclusions=front/node_modules/**,front/dist/**,back/build/**

# Backend (Java)
sonar.java.binaries=back/build/classes
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend (TypeScript)
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info

sonar.sourceEncoding=UTF-8
