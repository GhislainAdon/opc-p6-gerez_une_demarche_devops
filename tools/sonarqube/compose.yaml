# Local SonarQube instance (Community edition) for quality-gate analysis.
#   docker compose -f tools/sonarqube/compose.yaml up -d
#   → http://localhost:9000 (admin/admin at first start, change the password,
#     then create a project token and export SONAR_TOKEN / SONAR_HOST_URL)
services:
  sonarqube:
    image: sonarqube:community
    container_name: orion-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
